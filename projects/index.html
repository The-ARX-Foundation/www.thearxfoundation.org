    document.querySelectorAll(".stage-chip").forEach(c=>{const on=c.dataset.s===state.stage; c.classList.toggle("on",on); c.setAttribute("aria-pressed",on);}); draw(); }; }
$("#themes").innerHTML = DATA.themes.slice(0, PRIV ? 40 : 24).map(([t,n]) => `<button class="chip" data-t="${esc(t)}">${esc(t)}<i>${n}</i></button>`).join("");
$("#themes").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; const t=b.dataset.t; state.theme.has(t)?state.theme.delete(t):state.theme.add(t); b.classList.toggle("on"); draw(); };

const val = (p,k,fmt=v=>esc(v)) => p[k]==null || p[k]==="" ? "—" : (p.suggested.includes(k) ? `<span class="sugv">≈ ${fmt(p[k])}</span>` : fmt(p[k]));
const badge = (p,k,cls="") => p[k] ? `<span class="b ${cls} ${p.suggested.includes(k)?"sug":""}" title="${k}${p.suggested.includes(k)?" (suggested)":""}">${esc(p[k])}</span>` : "";
const dots = n => `<span class="dots" aria-label="${n} of 5">${"●".repeat(n)}${"○".repeat(5-n)}</span>`;
function links(p, ids){ return ids.filter(i => byId[i]).map(i => `<a class="wl" href="#${i}" data-go="${i}">${esc(byId[i].title)}</a>`).join("") || (ids.length ? `<span class="sugv">${ids.length} not shown</span>` : "—"); }
const ei = p => { const e=p.effort_invested||{}; return [e.versions&&`${e.versions} ver`, e.chats&&`${e.chats} chats`, e.span_days?`${e.span_days} d`:null].filter(Boolean).join(" · ") || "—"; };
const conn = p => p.related.length + p.depends_on.length + p.blocks.length;

function card(p){
  const code = p.code.map(c => c.kind==="github" ? `<a href="https://github.com/${esc(c.ref)}" rel="noopener">${esc(c.ref)}</a>` : `<span class="mono">${esc(c.ref.split("/Coding/").pop())}</span>${c.commits?` · ${c.commits} commits`:""}`).join("<br>");
  const needs = [["skills",p.skills],["people",p.people],["hardware",p.hardware]].filter(x=>x[1].length).map(([k,v])=>`${k}: ${v.map(esc).join(", ")}`).join("<br>");
  return `<article class="card" id="${p.id}" data-p="${esc(p.priority||"")}">
    <div class="mono id">${p.id}${p.category?` · ${esc(p.category)}`:""}</div>
    <h3>${p.page?`<a href="${esc(p.page)}" style="color:inherit;text-decoration:none">${esc(p.title)}</a>`:esc(p.title)}</h3>
    ${p.pitch?`<p class="pitch">${esc(p.pitch)}</p>`:""}
    ${p.page?`<a class="readmore" href="${esc(p.page)}">${esc(p.page_label||"Read the write-up")} &rarr;</a>`:""}
    <div class="badges">${p.stage?`<span class="b st-${esc(p.stage.split(" ")[0])}" title="stage">${esc(p.stage)}</span>`:""}${badge(p,"priority")}${badge(p,"status")}${badge(p,"entity")}${PRIV?badge(p,"visibility","vis-"+p.visibility):""}${p.decision?`<span class="b">${esc(p.decision)}</span>`:""}${PRIV&&p.ip_flag_insightally?`<span class="b warn">IP boundary</span>`:""}${PRIV&&p.placeholder?`<span class="b sug">placeholder</span>`:""}${PRIV&&p.scope&&p.scope!=="ARX"?`<span class="b warn">${esc(p.scope)}</span>`:""}${PRIV&&p.kind==="curated"?`<span class="b">curated</span>`:""}</div>
    ${p.decision==="archive"?`<p class="shelved">Shelved for now. Open to collaborators or funding: <a href="mailto:${esc(DATA.contact.email)}?subject=${encodeURIComponent(p.title)}">get in touch</a>.</p>`:""}
    ${p.blurb?`<p class="blurb">${esc(p.blurb)}</p>`:""}
    ${p.summary?`<p style="margin:.2rem 0 .5rem;color:var(--muted)">${esc(p.summary)}</p>`:""}
    ${p.sug_signal?`<div class="sec signal"><h4>Suggested 90-day signal</h4><span class="sugv">${esc(p.sug_signal)}</span></div>`:""}
    ${PRIV&&p.local_href?`<div class="sec"><a href="${esc(p.local_href)}">open collected copy ↗</a></div>`:""}
    <dl class="metrics">
      <div><dt>Horizon</dt><dd>${val(p,"horizon")}</dd></div>
      <div><dt>Effort left</dt><dd>${val(p,"effort_remaining")}</dd></div>
      <div><dt>Effort in</dt><dd>${ei(p)}</dd></div>
      <div><dt>Feasibility</dt><dd>${p.feasibility?dots(+p.feasibility):"—"}</dd></div>
      <div><dt>Last touched</dt><dd>${esc(p.last_touched||"—")}${p.staleness_days>180?` <span class="warn">(${p.staleness_days} d)</span>`:""}</dd></div>
      <div><dt>Revenue</dt><dd>${val(p,"revenue")}</dd></div>
    </dl>
    ${p.next_action?`<div class="sec"><h4>Next action</h4>${esc(p.next_action)}</div>`:""}
    ${p.related.length?`<div class="sec"><h4>Crossovers</h4>${links(p,p.related)}</div>`:""}
    <details><summary>Dependencies, needs &amp; detail</summary>
      <div class="sec"><h4>Depends on</h4>${links(p,p.depends_on)}</div>
      <div class="sec"><h4>Blocks</h4>${links(p,p.blocks)}</div>
      <div class="sec"><h4>Blockers</h4>${esc(p.blockers||"—")}</div>
      <div class="sec"><h4>Needs</h4>${needs||"—"}${PRIV&&p.money?`<br>money: ${esc(p.money)}`:""}${p.legal_ip?`<br>legal/IP: ${val(p,"legal_ip")}`:""}</div>
      ${p.feasibility_why?`<div class="sec"><h4>Feasibility</h4>${esc(p.feasibility_why)}</div>`:""}
      ${p.themes.length?`<div class="sec"><h4>Themes</h4><div class="ttags">${p.themes.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></div>`:""}
      ${code?`<div class="sec"><h4>Code</h4>${code}</div>`:""}
      ${PRIV?`<div class="sec"><h4>Private</h4>${p.private_markers.length?`markers: ${p.private_markers.map(esc).join(", ")}<br>`:""}${p.note?`note: ${esc(p.note)}<br>`:""}${p.chat?`<a href="${esc(p.chat)}" rel="noopener">source chat</a>`:""}${p.local?` · <a class="mono" href="${esc(p.local_href||"")}">${esc(p.local)}</a>`:""}${(p.links||[]).map((u,i)=>`<br><a href="${esc(u)}" rel="noopener">artifact ${i+1}</a>`).join("")}${(p.conversations||[]).map(c=>typeof c==="string"?`<br>${esc(c)}`:`<br><span class="mono">${esc(c.date||"")}</span> ${esc(c.title||"")}`).join("")}</div>`:""}
    </details>
  </article>`;
}

function draw(){
  const f = k => $("#f-"+k) ? $("#f-"+k).value : "";
  let rows = P.filter(p =>
    (PRIV && $("#f-ph").checked || !p.placeholder) &&
    (!state.stage || p.stage===state.stage) && (!f("cat") || p.category===f("cat")) &&
    (!f("priority") || p.priority===f("priority")) && (!f("status") || p.status===f("status")) &&
    (!f("horizon") || p.horizon===f("horizon")) && (!f("entity") || p.entity===f("entity")) &&
    (!f("vis") || p.visibility===f("vis")) && (!f("scope") || p.scope===f("scope")) &&
    [...state.theme].every(t => p.themes.includes(t)) &&
    (!state.q || [p.title,p.pitch,p.blurb,p.category,p.next_action,p.blockers,...p.themes,...p.skills,...p.people,...p.hardware].join(" ").toLowerCase().includes(state.q)));
  const pi = p => p.priority ? PRI.indexOf(p.priority) : 9, ev = p => (p.effort_invested.versions||0)*3 + (p.effort_invested.chats||0)*2 + (p.effort_invested.span_days||0)/30;
  const S = { priority:(a,b)=>(!!b.page-!!a.page)||pi(a)-pi(b)||ev(b)-ev(a), effort:(a,b)=>ev(b)-ev(a), feasibility:(a,b)=>(b.feasibility||0)-(a.feasibility||0),
    links:(a,b)=>conn(b)-conn(a), fresh:(a,b)=>String(b.last_touched).localeCompare(a.last_touched), stale:(a,b)=>(b.staleness_days||0)-(a.staleness_days||0) };
  rows.sort(S[$("#sort").value]);
  $("#count").textContent = `${rows.length} of ${P.length} shown`;
  $("#grid").innerHTML = rows.length ? rows.map(card).join("") : `<div class="empty">${P.length ? "No projects match these filters." : "No projects have been published yet. Check back soon."}</div>`;
  const real = P.filter(p=>!p.placeholder), cnt = k => real.filter(k).length;
  $("#stats").innerHTML = [["projects",real.length],["P0 · now",cnt(p=>p.priority==="P0")],["active / building",cnt(p=>["active","build"].includes(p.status))],["blocked",cnt(p=>p.status==="blocked"||p.blockers)],["with crossovers",cnt(p=>p.related.length)],PRIV?["public (confirmed)",cnt(p=>p.confirmed_public)]:null].filter(Boolean).map(([l,n])=>`<div class="stat"><b>${n}</b><span class="mono">${l}</span></div>`).join("");
}
document.addEventListener("click", e => { const a=e.target.closest("[data-go]"); if(!a) return; const el=document.getElementById(a.dataset.go);
  if(!el){ ["#q","#f-cat","#f-priority","#f-status","#f-horizon","#f-entity","#f-vis","#f-scope"].forEach(s=>$(s)&&($(s).value="")); state.q=""; state.theme.clear(); state.stage=""; document.querySelectorAll(".stage-chip").forEach(c=>c.classList.toggle("on",c.dataset.s==="")); document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on")); if($("#f-ph")) $("#f-ph").checked=true; draw(); }
  e.preventDefault(); const t=document.getElementById(a.dataset.go); if(t){ t.scrollIntoView({behavior:"smooth",block:"start"}); t.classList.add("flash"); setTimeout(()=>t.classList.remove("flash"),1600); history.replaceState(null,"","#"+a.dataset.go);} });
$("#foot").textContent = `Generated ${DATA.generated} · ${PRIV ? "private build" : "public build"} · The ARX Foundation`;
draw();
if (location.hash) setTimeout(()=>{ const t=document.querySelector(location.hash); t&&t.scrollIntoView(); },50);
</script>
</body>
</html>
