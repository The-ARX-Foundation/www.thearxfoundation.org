# Deploy www.thearxfoundation.org (public static monorepo) via FTP on push to main.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# If the FTP session lands outside the www document root, set server-dir under `with:` (SiteGround path).
# Node 24: checkout@v5 + FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 (GitHub Actions JS runtime deprecation).
name: Deploy via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # server-dir: /public_html/www.thearxfoundation.org/
          exclude: |
            **/.git*
            **/.github/**
            **/README.md
            **/.gitignore
